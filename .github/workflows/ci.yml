name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false # a failure on one OS should not hide the result on the other
      matrix:
        # macos-latest is Apple Silicon, the only Mac architecture we support.
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # `tauri build` refuses mismatched npm and Rust packages, but `tauri info` exits 0 on them.
      - name: Check Tauri package versions
        shell: bash
        run: |
          npx tauri info 2>&1 | tee tauri-info.log
          ! grep -q "version mismatched" tauri-info.log

      - name: Type-check and build frontend
        run: npm run build

      - name: Run tests
        run: npm run test:run

      - name: Check Rust
        working-directory: src-tauri
        run: cargo check --locked
